name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run:  sudo docker build  --no-cache  --build-arg=FRAPPE_PATH=https://github.com/frappe/frappe  --build-arg=FRAPPE_BRANCH=version-16  --secret=id=apps_json,src=apps.json   --tag micro365/micro365:erpnext-dev --platform=linux/amd64 --file=images/layered/Containerfile .
      
      
      #docker build . --tag micro365/micro365:erpnext-plus

name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6


      
    - name: Docker Login
      # You may pin to the exact commit or the version.
      uses: docker/login-action@v4.6.0
      with:
        # Server address of Docker registry. If not set then will default to Docker Hub
        registry: # optional
        # Username used to log against the Docker registry
        username: micro365
        # Password or personal access token used to log against the Docker registry
        password: ${{ secrets.DOCKER_TOKEN }}
        
    - name: Build the Docker image
      run:  #!/bin/bash
        sudo docker build  --no-cache  --build-arg=FRAPPE_PATH=https://github.com/frappe/frappe  --build-arg=FRAPPE_BRANCH=version-16  --secret=id=apps_json,src=apps.json   --tag micro365/micro365:erpnext-plus --platform=linux/amd64 --file=images/layered/Containerfile .
    - name: Push the Docker image
      run:  docker push micro365/micro365:erpnext-plus

    

